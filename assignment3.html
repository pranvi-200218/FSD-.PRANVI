<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bus Booking System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #c8b6d8;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 30px;
        }
        
        .booking-card {
            width: 600px;
            height: 600px;
            background-color: rgb(224, 236, 235);
            border: 3px rosybrown solid;
            padding: 15px;
            box-sizing: border-box;
            overflow-y: auto;
        }
        
        .bus-image {
            width: 100%;
            height: 150px;
            object-fit: cover;
            display: block;
            border: 2px solid rosybrown;
        }
        
        .box {
            border: 2px solid rosybrown;
            padding: 10px;
            margin-top: 12px;
        }
        
        .box h3 {
            margin: 0 0 10px 0;
        }
        
        label {
            display: inline-block;
            width: 150px;
            margin-bottom: 10px;
        }
        
        input,
        select {
            padding: 6px;
            width: 200px;
            box-sizing: border-box;
        }
        
        input[type="radio"] {
            width: auto;
        }
        
        .radio-label {
            width: auto;
        }
        
        .buy-btn {
            width: 100%;
            padding: 10px;
            margin-top: 12px;
            background-color: rgb(231, 14, 115);
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        
        .buy-btn:hover {
            background-color: #333;
        }
        /* RESULT CARD */
        
        #result {
            display: none;
            width: 600px;
            margin-top: 20px;
            background-color: white;
            border: 3px solid rosybrown;
            padding: 20px;
            box-sizing: border-box;
        }
        
        #result h2 {
            text-align: center;
        }
        
        .total {
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>


<body>

    <div>
        <div class="booking-card">
            <img class="bus-image" src="https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?auto=format&fit=crop&w=1000&q=80" alt="Bus">
            <div class="box">
                <h3>User Information</h3>
                <label>Username:</label>
                <input type="text" id="username">

                <br>

                <label>User Age:</label>
                <input type="number" id="age">

                <br>

                <label>User Aadhar No:</label>
                <input type="text" id="aadhar">

                <br>

                <label>Select Your City:</label>

                <select id="city">

                    <option value="">Select City</option>
                    <option>Delhi</option>
                    <option>Ghaziabad</option>
                    <option>Lucknow</option>
                    <option>Jaipur</option>
                    <option>Mumbai</option>

                </select>

                <br>
                <label>Journey Date:</label>

                <input type="date" id="journeyDate" placeholder="dd-mm-yyyy">

            </div>
            <div class="box">

                <h3>Bus Information</h3>

                <input type="radio" name="bus" id="ac" value="AC Bus" data-price="2000">

                <label class="radio-label">
                    AC Bus - ₹2000
                </label>
                <br>
                <input type="radio" name="bus" id="nonac" value="Non-AC Bus" data-price="1500">
                <label class="radio-label">
                    Non-AC Bus - ₹1500
                </label>

                <br><br>
                <label>Select Your Seat:</label>

                <select id="seats">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>

                </select>

            </div>
            <button class="buy-btn" onclick="buyNow()">
                Buy Now
            </button>
        </div>
        <div id="result">

            <h2>Booking Details</h2>
            <p>
                <b>Username:</b>
                <span id="rName"></span>
            </p>

            <p>
                <b>Age:</b>
                <span id="rAge"></span>
            </p>

            <p>
                <b>Aadhar No:</b>
                <span id="rAadhar"></span>
            </p>

            <p>
                <b>City:</b>
                <span id="rCity"></span>
            </p>

            <p>
                <b>Journey Date:</b>
                <span id="rDate"></span>
            </p>

            <p>
                <b>Bus:</b>
                <span id="rBus"></span>
            </p>

            <p>
                <b>Seats:</b>
                <span id="rSeats"></span>
            </p>

            <p>
                <b>Price per seat:</b> ₹
                <span id="rPrice"></span>
            </p>

            <hr>

            <p class="total">
                Total Amount: ₹
                <span id="rTotal"></span>
            </p>
        </div>
    </div>
    <script>
        function buyNow() {
            let username =
                document.getElementById("username").value;
            let age =
                document.getElementById("age").value;
            let aadhar =
                document.getElementById("aadhar").value;
            let city =
                document.getElementById("city").value;
            let date =
                document.getElementById("journeyDate").value;

            let bus =
                document.querySelector(
                    'input[name="bus"]:checked'
                );
            let seats =
                document.getElementById("seats").value;
            if (
                username === "" ||
                age === "" ||
                aadhar === "" ||
                city === "" ||
                date === "" ||
                bus === null
            ) {

                alert("Please fill all details!");

                return;
            }
            let price =
                Number(bus.getAttribute("data-price"));
            let total =
                price * Number(seats);


            // PUT DATA IN RESULT CARD

            document.getElementById("rName").innerText =
                username;

            document.getElementById("rAge").innerText =
                age;

            document.getElementById("rAadhar").innerText =
                aadhar;

            document.getElementById("rCity").innerText =
                city;

            document.getElementById("rDate").innerText =
                date;

            document.getElementById("rBus").innerText =
                bus.value;

            document.getElementById("rSeats").innerText =
                seats;

            document.getElementById("rPrice").innerText =
                price;

            document.getElementById("rTotal").innerText =
                total;
            document.getElementById("result").style.display =
                "block";
        }
    </script>

</body>

</html>
