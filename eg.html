<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open Website in Specific Area</title>
</head>
<body>
  <!-- Link that opens inside iframe -->
  <a href="https://www.example.com" target="myFrame">Open Example</a> |
  <a href="https://www.wikipedia.org" target="myFrame">Open Wikipedia</a>

  <br><br>

  <!-- Specific area (iframe) -->
  <iframe name="myFrame" width="800" height="400" style="border:1px solid black;"></iframe>
</body>
</html>
