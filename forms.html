<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forms</title>
</head>
<body>
    <center>
        <!-- Add video here -->
        <div>
            <video width="400" controls autoplay muted loop>
                <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>
        <br><br>

        <form action="REGISTRATION PAGE">
            <div> 
                <img src="https://www.inuvika.com/wp-content/uploads/2018/12/clients-18.jpg" height="55" >
            </div>
            <div>
                <label for="name"> Name</label>
                <input id="name" type="text" placeholder="enter name" required> 
            </div><br><br>

            <div>
                <label for="phone"> Phone</label>
                <input id="phone" type="tel" placeholder="enter phone" required>
            </div><br><br>

            <div>
                <label for="email"> Email</label>
                <input id="email" type="email" placeholder="enter email" required>
            </div><br><br>
              
            <div>
                <h2>SECTION</h2>
                <input id="cse21" type="radio" name="section" value="cse 21">
                <label for="cse21"> cse 21</label>

                <input id="cse22" type="radio" name="section" value="cse 22">
                <label for="cse22"> cse 22</label>

                <input id="cse23" type="radio" name="section" value="cse 23">
                <label for="cse23"> cse 23</label>
            </div><br><br>
           
            <!-- language preference -->
            <div>
                <label for="language">Preferred Language</label>
                <select id="language" name="language" required>
                    <option value="">--Select--</option>
                    <option value="java">Java</option>
                    <option value="python">Python</option>
                    <option value="cpp">C++</option>
                </select>
            </div><br><br>
          
            <div> <button type="submit">Submit</button></div>
            <div> <button type="reset">Reset</button></div>
        </form>
    </center>
</body>
</html>
